[package]
name = "cortex"
version = "0.1.0"
edition = "2021"

[features]
local-embed = ["dep:fastembed"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
thiserror = "2"
toml = "0.8"
dirs = "5"
inquire = "0.7"
indicatif = "0.17"
bench = { path = "../bench" }
fastembed = { version = "4", optional = true }
