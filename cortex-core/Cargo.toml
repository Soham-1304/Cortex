[package]
name = "cortex-core"
version = "0.1.0"
edition = "2021"
description = "Retrieval primitives for Cortex: tokenizer, BM25, RRF, knapsack packing, tree-sitter symbols"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
